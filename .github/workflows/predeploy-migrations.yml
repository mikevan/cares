name: CI: Validate Migrations & Pre-deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-migrations:
    name: Validate migrations (PRs and pushes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against service DB
        run: python scripts/run_migrations.py

      - name: Run smoke check against DB
        run: python scripts/ci_smoke_check.py

      - name: Run unit tests
        run: python -m unittest discover -v

  run-prod-migrations:
    name: Run migrations on production (manual/push)
    if: github.event_name == 'push' && secrets.PRODUCTION_DATABASE_URL != ''
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against production DB
        run: python scripts/run_migrations.py

      - name: Run smoke check against production DB
        run: python scripts/ci_smoke_check.py

      - name: Notify
        run: echo "Production migrations completed. If this job ran, ensure the application instances are restarted as part of your deployment process."
