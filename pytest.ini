# CARES Test Harness - Pytest Configuration
# ==========================================

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default test paths
testpaths = tests

# Exclude directories from test collection
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    htmlcov
    instance
    static
    templates
    migrations
    alembic
    node_modules
    *.egg-info
    dist
    build
    scripts
    blueprints
    services

# Test markers - organize tests by type
markers =
    unit: Unit tests (isolated, no database, fast)
    integration: Integration tests (routes + database)
    functional: Functional/end-to-end tests (complete features)
    uat: User acceptance tests (real-world scenarios)
    smoke: Smoke tests (can run in production, basic health checks)
    slow: Tests that take significant time (>1 second)

# Output and reporting options
addopts = 
    -v
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=5
    --html=tests/reports/test_report.html
    --self-contained-html
    --maxfail=5
    --timeout=30

# Coverage configuration
[coverage:run]
source = .
omit = 
    tests/*
    venv/*
    */site-packages/*
    */dist-packages/*
    */__pycache__/*
    */migrations/*
    config.py
    run_tests.py
    old_tests/*
    scripts/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Log configuration for tests
log_cli = false
log_cli_level = INFO

# Timeout settings
timeout = 30
timeout_method = thread
# McCabe complexity configuration

[mccabe]
mccabe-complexity = 10