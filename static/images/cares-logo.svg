<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4a33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b4a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Interlocking rings representing community -->
  <circle cx="30"  cy="50" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.9"/>
  <circle cx="52"  cy="50" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.75"/>
  <circle cx="74"  cy="50" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.6"/>

  <!-- CARES wordmark -->
  <text x="112" y="58" font-family="Georgia, serif" font-size="38" font-weight="bold"
        fill="url(#shieldGrad)" letter-spacing="4">CARES</text>

  <!-- Tagline -->
  <text x="114" y="76" font-family="Arial, sans-serif" font-size="10.5" fill="#4a7a63"
        letter-spacing="0.5">Community Accounting &amp; Resource Engagement System</text>
</svg>
