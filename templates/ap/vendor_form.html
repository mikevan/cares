{% extends "base.html" %}
{% block title %}{{ 'Edit Vendor' if vendor else 'New Vendor' }} - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ 'Edit Vendor' if vendor else 'New Vendor' }}</h1>
    <a href="{{ url_for('ap.vendors') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to Vendors
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Vendor Name *</label>
                    <input type="text" class="form-control" name="name" value="{{ vendor.name if vendor else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Name</label>
                    <input type="text" class="form-control" name="contact_name" value="{{ vendor.contact_name if vendor else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ vendor.email if vendor else '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{ vendor.phone if vendor else '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" value="{{ vendor.address if vendor else '' }}">
            </div>
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" name="city" value="{{ vendor.city if vendor else '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" name="state" maxlength="2" value="{{ vendor.state if vendor else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">ZIP Code</label>
                    <input type="text" class="form-control" name="zip_code" value="{{ vendor.zip_code if vendor else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Payment Terms</label>
                    <select class="form-select" name="payment_terms">
                        {% for terms in ['Net15', 'Net30', 'Net45', 'Net60', 'Due on Receipt'] %}
                        <option value="{{ terms }}" {{ 'selected' if (vendor and vendor.payment_terms == terms) or (not vendor and terms == 'Net30') else '' }}>
                            {{ terms }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="is_1099" id="is_1099"
                               {{ 'checked' if vendor and vendor.is_1099 else '' }}>
                        <label class="form-check-label" for="is_1099">Requires 1099</label>
                    </div>
                </div>
                {% if vendor %}
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="active" id="active"
                               {{ 'checked' if vendor.active else '' }}>
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                </div>
                {% endif %}
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3">{{ vendor.notes if vendor else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> {{ 'Save Changes' if vendor else 'Create Vendor' }}
                </button>
                <a href="{{ url_for('ap.vendors') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
