{% extends "base.html" %}

{% block title %}CARES — Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <!-- Logo/Header -->
 <div class="login-header">
            <div class="login-logo">
                {% if org_code %}
                <script>
                var loginLogoFormats = ['svg', 'png', 'gif'];
                var loginLogoFormatIndex = 0;
                function tryNextLoginLogoFormat(img) {
                    loginLogoFormatIndex++;
                    if (loginLogoFormatIndex < loginLogoFormats.length) {
                        img.src = img.src.replace(/\.\w+$/, '.' + loginLogoFormats[loginLogoFormatIndex]);
                    } else {
                        img.onerror = null;
                        img.src = "{{ url_for('static', filename='images/cares.svg') }}";
                        img.alt = "CARES";
                    }
                }
                </script>
                <img src="{{ url_for('static', filename='images/' + org_code + '.svg') }}"
                     alt="{{ org_name or 'CARES' }}"
                     class="login-logo-img"
                     onerror="tryNextLoginLogoFormat(this)">
                {% else %}
                <img src="{{ url_for('static', filename='images/cares.svg') }}"
                     alt="CARES"
                     class="login-logo-img">
                {% endif %}
            </div>
        </div>

        <!-- Login Form -->
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-with-icon">
                    <i class="bi bi-person"></i>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           name="username" 
                           placeholder="Enter your username"
                           required 
                           autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-with-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           name="password" 
                           placeholder="Enter your password"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 login-button">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            <p class="text-muted mb-0">
                <i class="bi bi-shield-check"></i> Secure Login
            </p>
            <p class="text-muted small mt-2">
                Default: admin / admin123
            </p>
        </div>
    </div>
</div>
{% endblock %}
