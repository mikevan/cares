{% extends "base.html" %}

{% block title %}{{ 'Edit' if project else 'New' }} Project{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ 'Edit' if project else 'New' }} Project</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="name" class="form-label">Project Name *</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ project.name if project else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="Active" {{ 'selected' if project and project.status == 'Active' else '' }}>Active</option>
                        <option value="Completed" {{ 'selected' if project and project.status == 'Completed' else '' }}>Completed</option>
                        <option value="On Hold" {{ 'selected' if project and project.status == 'On Hold' else '' }}>On Hold</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ project.description if project else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="budget" class="form-label">Budget ($)</label>
                    <input type="number" step="0.01" class="form-control" id="budget" name="budget" value="{{ project.budget if project else '0.00' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ project.start_date.strftime('%Y-%m-%d') if project and project.start_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="end_date" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ project.end_date.strftime('%Y-%m-%d') if project and project.end_date else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Project Leaders</label>
                    <select class="form-select" name="leaders" multiple size="5">
                        {% for member in members %}
                        <option value="{{ member.id }}" {{ 'selected' if project and member in project.leaders else '' }}>{{ member.name }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Volunteers</label>
                    <select class="form-select" name="volunteers" multiple size="5">
                        {% for member in members %}
                        <option value="{{ member.id }}" {{ 'selected' if project and member in project.volunteers else '' }}>{{ member.name }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                </div>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/projects" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Project</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
